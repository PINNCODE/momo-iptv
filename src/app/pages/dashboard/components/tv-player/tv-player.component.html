<!-- Full-screen player wrapper -->
<div class="player-root">

  <!-- Video element: click on video toggles play -->
  <video #videoEl class="player-video" playsinline (click)="togglePlay()"></video>

  <!-- Loading spinner -->
  <div class="player-loading" *ngIf="isLoading && !hasError">
    <div class="spinner"></div>
  </div>

  <!-- Error state -->
  <div class="player-error" *ngIf="hasError">
    <svg class="w-16 h-16 text-white/50 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
        d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
    </svg>
    <p class="text-white/70 text-lg font-medium">No se pudo conectar al stream</p>
    <p class="text-white/40 text-sm mt-1">Verifica tu conexión o la URL del canal</p>
  </div>

  <!-- Controls overlay (auto-hide) -->
  <div class="controls-overlay" [class.visible]="controlsVisible">

    <!-- Top-left: channel title (click through to video below) -->
    <div class="top-bar" (click)="$event.stopPropagation()">
      <div class="live-badge">EN VIVO</div>
      <span class="channel-title">{{ currentEpg?.title ?? 'Canal en vivo' }}</span>
    </div>

    <!-- Transparent click area that forwards clicks to the video (toggle play) -->
    <div class="click-area" (click)="togglePlay()"></div>

    <!-- Unified bottom strip: controls + EPG in one bar -->
    <div class="bottom-strip" (click)="$event.stopPropagation()">

      <!-- Left: play/pause + volume -->
      <div class="strip-left">
        <button class="ctrl-btn" (click)="togglePlay()" aria-label="Play/Pause">
          <svg *ngIf="!isPlaying" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg *ngIf="isPlaying" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>

        <!-- Volume -->
        <div class="volume-group">
          <button class="ctrl-btn" (click)="toggleMute()" aria-label="Mute">
            <svg *ngIf="!isMuted && volume > 0" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
            </svg>
            <svg *ngIf="isMuted || volume === 0" class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
              <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
            </svg>
          </button>
          <input
            type="range"
            class="volume-slider"
            min="0" max="1" step="0.05"
            [value]="isMuted ? 0 : volume"
            (input)="onVolumeChange($event)"
            aria-label="Volumen"
          />
        </div>
      </div>

      <!-- Centre: EPG cards -->
      <div class="strip-epg" *ngIf="currentEpg">
        <!-- Current programme -->
        <div class="epg-card epg-card--current">
          <span class="epg-badge">AHORA</span>
          <p class="epg-title">{{ currentEpg.title }}</p>
          <p class="epg-time">{{ formatTime(currentEpg.start) }} – {{ formatTime(currentEpg.end) }}</p>
        </div>
        <!-- Upcoming -->
        <div class="epg-card" *ngFor="let ep of upcomingEpg">
          <span class="epg-time-pre">{{ formatTime(ep.start) }}</span>
          <p class="epg-title">{{ ep.title }}</p>
          <p class="epg-time">hasta {{ formatTime(ep.end) }}</p>
        </div>
      </div>

      <!-- Right: symmetric spacer so EPG stays centred -->
      <div class="strip-right" aria-hidden="true"></div>

    </div>

  </div>
</div>
