<div class="h-screen w-full relative flex items-center p-6 md:p-10">
    
    <!-- Sidebar Component -->
    <div class="flex items-center z-10">
        <app-sidebar [activeView]="currentView" (onMenuSelect)="changeView($event)" (onLogout)="openLogoutConfirm()"></app-sidebar>
    </div>
    
    <!-- Contenedor Principal Dinámico -->
    <div class="flex-grow h-full ml-6 overflow-hidden">
        <app-tv-view *ngIf="currentView === 'tv'" class="w-full h-full block"></app-tv-view>
        <app-search-view *ngIf="currentView === 'search'" class="w-full h-full block"></app-search-view>
        <app-profile-view *ngIf="currentView === 'profile'" class="w-full h-full block"></app-profile-view>
        
        <div *ngIf="currentView === 'home'" class="w-full h-full flex items-center justify-center text-white/50 text-2xl font-light tracking-wider animate-fade-in">
            Selecciona una opción en el menú
        </div>
    </div>

    <!-- Modal de Confirmación de Cierre de Sesión (Glassmorphism Overlay) -->
    <div *ngIf="showLogoutConfirm" class="fixed inset-0 w-full h-full flex items-center justify-center bg-black/40 backdrop-blur-md z-50 animate-fade-in">
        
        <!-- Modal Card -->
        <div class="w-full max-w-md mx-4 p-6 md:p-8 rounded-[2rem] bg-white/40 dark:bg-black/40 backdrop-blur-2xl border border-white/50 dark:border-white/20 shadow-[0_12px_40px_0_rgba(0,0,0,0.3)] text-center transform scale-100 transition-all duration-300 animate-scale-up">
            
            <!-- Icono de Advertencia / Alerta -->
            <div class="w-16 h-16 mx-auto mb-5 rounded-full bg-red-500/10 border border-red-500/30 flex items-center justify-center text-red-500">
                <svg class="w-8 h-8 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path>
                </svg>
            </div>
            
            <!-- Textos -->
            <h3 class="text-xl font-bold text-gray-900 dark:text-white tracking-tight mb-2">¿Cerrar Sesión?</h3>
            <p class="text-gray-700 dark:text-white/70 text-sm leading-relaxed mb-6">
                ¿Estás seguro de que deseas salir? Tendrás que introducir tus credenciales nuevamente para acceder.
            </p>
            
            <!-- Botones de Acción -->
            <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 justify-center">
                <!-- Botón Cancelar -->
                <button (click)="closeLogoutConfirm()" 
                        class="w-full sm:w-auto px-6 py-2.5 rounded-full border border-white/50 dark:border-white/10 hover:bg-white/25 dark:hover:bg-white/5 text-gray-900 dark:text-white font-semibold text-sm transition-all duration-300 active:scale-95 cursor-pointer">
                    Cancelar
                </button>
                <!-- Botón Confirmar -->
                <button (click)="confirmLogout()" 
                        class="w-full sm:w-auto px-6 py-2.5 rounded-full bg-red-600 hover:bg-red-700 text-white font-semibold text-sm shadow-md transition-all duration-300 active:scale-95 cursor-pointer">
                    Cerrar Sesión
                </button>
            </div>
            
        </div>
    </div>
