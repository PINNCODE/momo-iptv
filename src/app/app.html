<!-- Global Ambient Background -->
<div class="fixed inset-0 w-full h-full bg-gray-50 dark:bg-gray-900 transition-colors duration-500 z-[-10]">
    <!-- Animated Gradient Background Elements (Fallback & Ambient Glow) -->
    <div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] rounded-full bg-purple-500/30 dark:bg-purple-600/40 blur-[100px] animate-blob z-0"></div>
    <div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] rounded-full bg-blue-500/30 dark:bg-blue-600/40 blur-[120px] animate-blob z-0" style="animation-delay: 2s;"></div>
    <div class="absolute top-[20%] right-[20%] w-[40%] h-[40%] rounded-full bg-pink-400/20 dark:bg-pink-500/30 blur-[90px] animate-blob z-0" style="animation-delay: 4s;"></div>

    <!-- Looping Background Video -->
    <video autoplay loop muted playsinline class="absolute inset-0 w-full h-full object-cover opacity-60 z-0 pointer-events-none">
        <source src="/background-loop.mp4" type="video/mp4">
    </video>
</div>

<!-- Main Router Content -->
<div class="relative z-0 min-h-screen">
    <router-outlet />
</div>
