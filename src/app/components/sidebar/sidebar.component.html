<!-- Sidebar Pill (Glassmorphism) -->
<nav class="flex flex-col items-center justify-between py-8 px-3 rounded-[2.5rem] bg-white/40 dark:bg-black/20 backdrop-blur-2xl border border-white/50 dark:border-white/10 shadow-[0_8px_32px_0_rgba(0,0,0,0.1)] dark:shadow-[0_8px_32px_0_rgba(0,0,0,0.3)] transform-gpu min-h-[450px]">
    
    <!-- Opciones Superiores -->
    <div class="flex flex-col items-center space-y-8">
        
        <!-- 1. Logo -->
        <div class="p-2 flex items-center justify-center">
            <img src="/logo.png" alt="Momo IPTV" class="w-10 h-10 object-contain rounded-xl">
        </div>

        <!-- Separador sutil -->
        <div class="w-8 h-px bg-white/20 dark:bg-white/10 rounded-full"></div>
        
        <!-- 2. TV Option -->
        <button (click)="selectMenu('tv')" 
                class="p-3 rounded-full hover:bg-white/20 dark:hover:bg-white/10 transition-colors duration-300 group cursor-pointer"
                [ngClass]="{'bg-white/20 dark:bg-white/10 shadow-inner scale-105': activeView === 'tv'}">
            <svg class="w-7 h-7 text-white/80 group-hover:text-white group-hover:scale-110 transition-all duration-300" [ngClass]="{'text-white': activeView === 'tv'}" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
            </svg>
        </button>

        <!-- 3. Search Option -->
        <button (click)="selectMenu('search')"
                class="p-3 rounded-full hover:bg-white/20 dark:hover:bg-white/10 transition-colors duration-300 group cursor-pointer"
                [ngClass]="{'bg-white/20 dark:bg-white/10 shadow-inner scale-105': activeView === 'search'}">
            <svg class="w-7 h-7 text-white/80 group-hover:text-white group-hover:scale-110 transition-all duration-300" [ngClass]="{'text-white': activeView === 'search'}" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
            </svg>
        </button>
    </div>

    <!-- Opciones Inferiores (Perfil y Logout) -->
    <div class="flex flex-col items-center relative space-y-4">
        <!-- 4. Profile Option -->
        <button (click)="selectMenu('profile')" 
                class="p-3 rounded-full hover:bg-white/20 dark:hover:bg-white/10 transition-colors duration-300 group cursor-pointer"
                [ngClass]="{'bg-white/20 dark:bg-white/10 shadow-inner scale-105': activeView === 'profile'}"
                title="Mi Cuenta">
            <svg class="w-7 h-7 text-white/80 group-hover:text-white group-hover:scale-110 transition-all duration-300" [ngClass]="{'text-white': activeView === 'profile'}" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
            </svg>
        </button>

        <!-- 5. Logout Button -->
        <button (click)="logoutRequested()" 
                class="p-3 rounded-full hover:bg-red-500/20 dark:hover:bg-red-500/10 transition-colors duration-300 group cursor-pointer"
                title="Cerrar Sesión">
            <svg class="w-7 h-7 text-white/80 group-hover:text-red-400 group-hover:scale-110 transition-all duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
            </svg>
        </button>
    </div>
</nav>
